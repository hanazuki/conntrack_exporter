name: Ruby

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    steps:
      - name: Enable unprivileged user namespaces
        run: |
          # Ubuntu also restricts user namespace capabilities through AppArmor.
          sudo sysctl -w \
            kernel.unprivileged_userns_clone=1 \
            kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install conntrack tools
        run: sudo apt-get update && sudo apt-get install -y conntrack
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
      - name: Test against the kernel in an isolated network namespace
        run: bundle exec rake spec:integration
